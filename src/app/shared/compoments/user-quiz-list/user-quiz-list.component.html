<div class="quiz-list-container w-full bg-white rounded-md">
    <div *ngIf="isLoading()" class="w-full flex items-end justify-end gap-2 text-xs text-red-600 font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-icon lucide-loader">
            <path d="M12 2v4"/>
            <path d="m16.2 7.8 2.9-2.9"/>
            <path d="M18 12h4"/>
            <path d="m16.2 16.2 2.9 2.9"/>
            <path d="M12 18v4"/>
            <path d="m4.9 19.1 2.9-2.9"/>
            <path d="M2 12h4"/>
            <path d="m4.9 4.9 2.9 2.9"/>
        </svg>
        suppression en cours...
    </div>
    <table class="w-full">
        <thead>
            <tr class="w-full bg-gray-100">
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Driver</td>
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Quiz</td>
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Note</td>
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Moyenne de Quiz</td>
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Date de création</td>
                <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">Actions</td>
            </tr>
        </thead>
        <tbody>
            @if (isFetching()) {
                <div class="flex items-center justify-start gap-3">
                    <svg class="animate-spin h-5 w-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs font-semibold">Chargement des quiz</span>
                </div>
            } @else {
                <div class="w-full" *ngIf="hasError()">
                    <app-toast-message [state]="state()" [message]="message()" />
                </div>
                @for (q of userQuizzes(); track q.id) {
                    <tr class="w-full border-b border-gray-300">
                        <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">{{ q.driver.fullName }}</td>
                        <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">{{ q.quiz.title }}</td>
                        <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">{{ q.note }}</td>
                        <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">{{ q.quiz.totalAvrage }}</td>
                        <td class="text-xs text-gray-600 font-semibold" style="padding: 10px;">{{ q.createdAt }}</td>
                        <td class="text-xs text-gray-600 font-semibold cursor-pointer" style="padding: 10px;">
                            <div class="w-full flex items-center justify-center gap-3">
                                <div (click)="navigateToUserQuizDetails(q.id)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0c5460" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye">
                                        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </div>
                                <div (click)="onDelete(q.id)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash">
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                                        <path d="M3 6h18"/>
                                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </div>
                            </div>
                        </td>
                    </tr>
                }
            }
        </tbody>
    </table>
</div>
