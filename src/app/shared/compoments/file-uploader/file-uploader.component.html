<div class="upload-container w-[250px]">
    <form class="w-full" [formGroup]="uploadForm()" (ngSubmit)="onUpload()">
        <div *ngIf="hasCategory()" class="w-full" style="margin-bottom: 10px;">
            <label class="text-xs font-semibold">Catégorie du fichier</label>
            <select name="categoryFile" id="categoryFile" formControlName="categoryFile" class="w-full text-xs font-semibold border border-gray-300 rounded-md p-2 cursor-pointer" style="padding: 5px 0;">
                <option [defaultSelected]="true">Sélectionnez une catégorie</option>
                <option *ngFor="let category of categories" [value]="category.id">{{ category.label }}</option>
            </select>
        </div>
        <input
            type="file"
            formControlName="image"
            class="w-full text-xs font-semibold border border-gray-300 rounded-md p-2 cursor-pointer"
            style="padding: 5px 0; margin-bottom: 10px;"
            (change)="onImageSelected($event)" 
        />

        <div class="w-full flex items-center justify-center gap-2" style="margin: 10px 0;" *ngIf="isLoading()">
            <svg class="animate-spin h-5 w-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xs text-gray-500 font-semibold">Uploading...</p>
        </div>

        <div class="w-full flex items-center justify-center" style="margin: 10px 0;" *ngIf="hasMessage()">
            <app-toast-message [state]="state()" [message]="message()" />
        </div>

        <div>
            <button
                type="button"
                [ngClass]="isLoading() ? 'text-gray-500 border-gray-300' : 'text-green-600 border-green-300'"
                [disabled]="isLoading()"
                class="w-full flex items-center justify-center gap-3 text-xs font-semibold text-center bg-white border shadow-sm rounded-md p-2 cursor-pointer"
                style="padding: 5px 0;"
                (click)="onUpload()"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload-icon lucide-upload">
                    <path d="M12 3v12"/>
                    <path d="m17 8-5-5-5 5"/>
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                </svg>
                Uploader
            </button>
        </div>
    </form>
</div>
