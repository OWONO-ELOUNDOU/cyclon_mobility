<div class="card-container w-[280px] bg-white border border-gray-300 rounded-lg" style="padding: 20px;">
    <span [ngClass]="tagType()" class="tag text-xs font-semibold rounded-full" style="padding: 2px 10px; margin-bottom: 15px;">{{ tagText() }}</span>
    <p [ngClass]="tagType()" class="count text-3xl font-semibold" style="margin-bottom: 15px;">{{ count() }}</p>
    <h3 class="text-xs font-semibold">{{ text() }}</h3>
</div>
