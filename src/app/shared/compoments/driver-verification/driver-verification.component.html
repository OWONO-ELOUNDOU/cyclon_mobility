    [disabled]="isLoading()"
    class="w-[150px] text-xs text-blue-600 font-semibold border border-gray-300 bg-white shadow-sm rounded-md cursor-pointer"
    style="padding: 5px 0;"
>
    @if (isLoading()) {
        vérification...
    } @else {
        Vérifier
    }
</button>
