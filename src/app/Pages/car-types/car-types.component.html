<p-dialog [(visible)]="displayDialog" [style]="{width: '450px', border: '1px solid #ccc', padding: '1rem', backgroundColor: 'white', borderRadius: '10px'}" header="Type de véhicule" [modal]="true" styleClass="p-fluid">
    <form class="w-full flex items-center justify-center flex-col gap-4" style="margin-top: 15px;">
        <div class="w-full flex items-start justify-start flex-col gap-2 field">
          <label class="text-xs text-gray-600 font-semibold" for="title">Titre</label>
          <input type="text" id="title" class="w-full h-[35px] text-xs text-gray-700 font-semibold border-2 border-gray-300 rounded-md" style="padding-left: 10px;" [(ngModel)]="carType().title" required autofocus />
        </div>
        <div class="w-full flex items-start justify-start flex-col gap-2 field">
          <label class="text-xs text-gray-600 font-semibold" for="registrationNumber">Numéro d'immatriculation</label>
          <input type="text" id="registrationNumber" class="w-full h-[35px] text-xs text-gray-700 font-semibold border-2 border-gray-300 rounded-md" style="padding-left: 10px;" [(ngModel)]="carType().registrationNumber" required autofocus />
        </div>
        <div class="w-full flex items-center justify-between gap-3 flex-wrap">
          <button class="w-[200px] h-[35px] text-xs text-gray-600 font-semibold border-2 border-gray-600 shadow-sm rounded-md cursor-pointer" (click)="displayDialog.set(false)">Annuler</button>
          <button class="w-[200px] h-[35px] text-xs text-green-600 font-semibold border-2 border-green-600 shadow-sm rounded-md cursor-pointer" (click)="saveCarType()">Enregistrer</button>
        </div>
    </form>
</p-dialog>
